<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Agentic-OS Mission Control – alle KI-Agenten, ein Dashboard.">
<title>Agentic-OS · Mission Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e3b36'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%232dd4bf' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%232dd4bf'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="brand"><span class="brand-mark">◉</span><div><h1>Agentic-OS</h1><small>Mission Control</small></div></div>
  <div class="live"><span class="dot" id="livedot"></span><span id="livetext">verbinde …</span></div>
</header>

<main>
<section aria-label="Agentenstatus"><span class="lbl">Agenten</span><div id="agents" role="list"></div></section>

<section id="chat" class="panel" aria-label="Task anlegen">
  <span class="lbl">Neuer Task</span>
  <form id="f">
    <label class="vh" for="agent">Agent</label>
    <select id="agent">
      <option>claude-code</option><option>hermes</option><option>openclaw</option>
      <option>codex</option><option>ollama</option><option>opencode</option><option>mock</option>
    </select>
    <label class="vh" for="user">Benutzer</label>
    <input id="user" placeholder="User" autocomplete="username">
    <label class="vh" for="pass">Passwort</label>
    <input id="pass" type="password" placeholder="Pass" autocomplete="current-password">
    <label class="vh" for="prompt">Task</label>
    <input id="prompt" placeholder="Task …">
    <button type="submit">Send</button>
  </form>
</section>

<div class="grid">
  <section aria-label="Kanban"><span class="lbl">Board</span>
    <div id="kanban">
      <div class="kcol" id="inbox"><h2>inbox <span class="n">0</span></h2></div>
      <div class="kcol" id="running"><h2>running <span class="n">0</span></h2></div>
      <div class="kcol" id="review"><h2>review <span class="n">0</span></h2></div>
      <div class="kcol" id="done"><h2>done <span class="n">0</span></h2></div>
      <div class="kcol" id="failed"><h2>failed <span class="n">0</span></h2></div>
    </div>
  </section>
  <div class="side">
    <section class="panel" id="detailWrap" aria-label="Details"><span class="lbl">Inspektion</span><div class="body"><div id="detail"></div></div></section>
    <section class="panel" aria-label="Memory"><h2 class="paneltitle">Memory</h2><ul id="memory"></ul></section>
    <section class="panel" aria-label="Cron"><h2 class="paneltitle">Cron</h2><ul id="cron"></ul></section>
  </div>
</div>

<section class="panel" aria-label="Ticker"><span class="lbl">Live-Ticker</span><ul id="ticker"></ul></section>
<div id="statusline" role="status"></div>
</main>
</div>
<script src="app.js"></script>
</body>
</html>
