services:
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./memory:/memory", "./data:/data"]
    restart: unless-stopped
  runner:
    build:
      context: .
      dockerfile: ./runner/Dockerfile
    env_file: .env
    volumes: ["./memory:/memory", "./data:/data"]
    restart: unless-stopped
  scheduler:
    build:
      context: .
      dockerfile: ./scheduler/Dockerfile
    ports: ["8001:8001"]
    env_file: .env
    volumes: ["./memory:/memory", "./data:/data"]
    restart: unless-stopped
  web:
    image: nginx:alpine
    ports: ["8080:80"]
    volumes: ["./web:/usr/share/nginx/html:ro"]
    restart: unless-stopped
